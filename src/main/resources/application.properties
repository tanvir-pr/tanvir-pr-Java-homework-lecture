spring.application.name=homework
server.port=8080

spring.thymeleaf.cache=false

# H2 file database (React CRUD / later steps) — required path c:\data
spring.datasource.url=jdbc:h2:file:C:/data/homeworkdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Oanda practice API (token loaded from password.txt — never commit secrets)
oanda.api.base-url=https://api-fxpractice.oanda.com
oanda.api.token-file=password.txt
