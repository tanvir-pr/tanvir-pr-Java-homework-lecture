<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Forex-Close | Astha Life</title>
</head>
<body>
<main>
    <div class="container">
        <h1 class="section-title">Forex-Close</h1>
        <p>Enter a TradeId to close the position at market price.</p>

        <div class="card">
            <form method="post" th:action="@{/forex/close}">
                <div class="form-row">
                    <div class="field">
                        <label for="tradeId">TradeId</label>
                        <input type="number" id="tradeId" name="tradeId" th:value="${tradeId}" required/>
                    </div>
                    <div class="field">
                        <button class="btn" type="submit">Close position</button>
                    </div>
                </div>
            </form>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div class="card" th:if="${result != null}">
            <table class="data">
                <tbody>
                <tr th:each="entry : ${result}">
                    <th th:text="${entry.key}">key</th>
                    <td th:text="${entry.value}">value</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
