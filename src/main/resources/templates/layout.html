<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:replace="${title}">Neumann Tech Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;family=Source+Serif+4:wght@600;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/theme.css}"/>
</head>
<body>
<header class="site-header">
    <div class="nav-inner">
        <a class="brand" th:href="@{/}">Neumann Tech Solutions</a>
        <button type="button" class="nav-toggle" id="navToggle" aria-label="Menu">Menu</button>
        <div th:replace="~{fragments/nav :: mainNav(${activeMenu})}"></div>
    </div>
</header>

<div th:replace="${content}">Content</div>

<footer class="site-footer">
    <p>
        Created by <strong>Student One / XXXXXX</strong>
        &amp;
        <strong>Student Two / YYYYYY</strong>
    </p>
    <p>Neumann Tech Solutions &mdash; Java Spring Boot Homework</p>
</footer>

<script>
    document.getElementById('navToggle')?.addEventListener('click', function () {
        document.getElementById('navMenu')?.classList.toggle('open');
    });
</script>
</body>
</html>
